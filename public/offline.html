<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lox Billiard POS - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .card {
      max-width: 420px;
      padding: 24px;
      border-radius: 12px;
      background: #1f2937;
      border: 1px solid #374151;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0;
      color: #d1d5db;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Lox Billiard POS cannot reach the server right now. Reconnect to continue normal operations.</p>
  </div>
</body>
</html>
